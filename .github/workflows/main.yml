name: Build IG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IG_DIR: "."        # anpassen, falls dein IG nicht im Repo-Root liegt
      JAVA_VERSION: "17"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Ruby (nur wenn Gemfile existiert)
        if: ${{ hashFiles(format('{0}/Gemfile', env.IG_DIR)) != '' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ${{ env.IG_DIR }}

      - name: Build IG using _genonce.sh
        working-directory: ${{ env.IG_DIR }}
        run: |
          set -e
          if [ ! -f "./_genonce.sh" ]; then
            echo "Datei ./_genonce.sh nicht gefunden (IG_DIR=${IG_DIR})."
            echo "Pass IG_DIR an oder pflege _genonce.sh in den IG root."
            ls -la
            exit 1
          fi

          chmod +x ./_genonce.sh
          ./_genonce.sh

      - name: Upload HTML output
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: |
            ${{ env.IG_DIR }}/output
            ${{ env.IG_DIR }}/publish
          if-no-files-found: warn
